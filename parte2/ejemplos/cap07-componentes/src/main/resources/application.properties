spring.application.name=componentes
# Los ejemplos se ejecutan como programa de consola: no se arranca Tomcat
spring.main.web-application-type=none
# Salida limpia: sin el logotipo de Spring y solo los mensajes de los ejemplos
spring.main.banner-mode=off
logging.level.root=warn
logging.level.com.comercializadora=info
logging.pattern.console=%m%n
