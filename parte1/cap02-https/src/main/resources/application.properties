# HTTPS en el puerto 8443 con el almacén PKCS12 del Listado anterior
server.port=8443
server.ssl.key-store=classpath:sgpc-local.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${SGPC_KEYSTORE_PASSWORD}
server.ssl.key-alias=sgpc
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2

# HTTP/2 sobre TLS (h2)
server.http2.enabled=true

# Cookie de sesión: solo por HTTPS, inaccesible desde JavaScript, mismo sitio
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
