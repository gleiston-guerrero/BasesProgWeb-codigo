# E1.2: proyecto de la Práctica 4 ampliado con Proveedor, fechas de vigencia y dashboard
# (base de datos dashboarddb)
spring.datasource.url=jdbc:h2:mem:dashboarddb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true

server.port=8080

# E1.2: data.sql se ejecuta después de que Hibernate cree las tablas
spring.jpa.defer-datasource-initialization=true
