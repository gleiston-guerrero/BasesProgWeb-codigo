# Base de datos H2 en memoria (solo para desarrollo; en producción se usa PostgreSQL/MySQL)
spring.datasource.url=jdbc:h2:mem:proveedoresdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate: crear/actualizar el esquema automáticamente según las entidades @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola web H2 accesible en http://localhost:8080/h2-console (solo desarrollo)
spring.h2.console.enabled=true

# Puerto del servidor Tomcat embebido
server.port=8080
