# Archivo: src/main/resources/application-prod.properties
# Los valores ${...} se leen de variables de entorno del sistema.
# Así, las credenciales NUNCA quedan escritas en el código ni en
# el repositorio: las provee el entorno de ejecución en producción.
spring.datasource.url=${SGPC_DB_URL}
spring.datasource.username=${SGPC_DB_USER}
spring.datasource.password=${SGPC_DB_PASSWORD}

# En producción: Flyway crea y versiona el esquema (sección de
# migraciones); Hibernate solo valida que coincide con las entidades
spring.jpa.hibernate.ddl-auto=validate

# La clave de firma de los tokens JWT también viene del entorno
sgpc.jwt.secret=${SGPC_JWT_SECRET}

# Caché con Caffeine (una sola instancia): límite de tamaño y TTL
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=1h

# Sin volcado de SQL en producción, aunque el archivo base lo active
spring.jpa.show-sql=false
