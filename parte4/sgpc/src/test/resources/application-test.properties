# Archivo: src/test/resources/application-test.properties
# Base de datos de prueba: H2 en memoria. Flyway crea en ella el
# esquema (V1) al arrancar el contexto y desaparece al terminar.
spring.datasource.url=jdbc:h2:mem:sgpc_test
spring.jpa.hibernate.ddl-auto=validate

# Clave de firma SOLO para pruebas (al menos 32 bytes para HS256)
sgpc.jwt.secret=clave-solo-para-pruebas-de-al-menos-32-bytes
