# Archivo: src/main/resources/application.properties
# Estado FINAL del libro (Parte IV): configuración base de desarrollo con H2.
# Los perfiles prod (application-prod.properties) y test (src/test/resources)
# sobrescriben solo las propiedades que declaran.
spring.application.name=sgpc

# --- Capítulo 10 (Listado "application.properties --- Esquema derivado") ---
# Genera/actualiza el esquema a partir de las entidades @Entity.
#   create       : recrea el esquema en cada arranque (desarrollo)
#   create-drop  : como create, y además lo borra al cerrar
#   update       : ajusta el esquema sin borrar datos
#   validate     : solo verifica que el esquema coincide (producción)
#   none         : no toca el esquema
# Capítulo 16 (Sección "Orden de arranque"): con Flyway, el esquema lo crea la
# migración V1 y Hibernate solo lo valida; update se sustituye por validate.
spring.jpa.hibernate.ddl-auto=validate

# Muestra en consola el SQL que Hibernate genera (útil para aprender)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Práctica 9: observación del SQL y consola de H2 ---
logging.level.org.hibernate.orm.jdbc.bind=trace
spring.datasource.url=jdbc:h2:mem:sgpcdb
spring.h2.console.enabled=true

# --- Capítulo 12 (Listado "application.properties --- Clave y caducidad del JWT") ---
# Clave HMAC para firmar y verificar los JWT (mínimo 32 bytes).
# Se toma de la variable de entorno SGPC_JWT_SECRET.
sgpc.jwt.secret=${SGPC_JWT_SECRET}

# Vida útil de cada token, en minutos.
sgpc.jwt.expiracion-minutos=60

# --- Capítulo 16 (Listado "application.properties --- Detalles de salud") ---
# Por defecto (never) el endpoint solo devuelve el estado agregado.
# when-authorized: los detalles (componente "db", espacio en disco,
# indicadores propios) solo se muestran a usuarios autenticados
# con alguno de estos roles; el resto sigue viendo solo el estado.
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN

# --- Práctica 13 (solo mientras se realiza): caducidad corta para observarla ---
# spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=30s

# --- Ejercicio E4.4: sin servidor Redis en desarrollo ---
# Caché en memoria y sin el indicador de salud de Redis
spring.cache.type=simple
management.health.redis.enabled=false
