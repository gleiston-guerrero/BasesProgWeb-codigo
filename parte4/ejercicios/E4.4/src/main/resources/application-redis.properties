# Archivo: src/main/resources/application-redis.properties
# Perfil OPCIONAL para desplegar VARIAS instancias del SGPC; no lo usa
# el despliegue de una sola instancia del Capítulo 16. Se activa junto
# al de producción: SPRING_PROFILES_ACTIVE=prod,redis
# Esa variante requiere además: en el pom.xml, el iniciador
# spring-boot-starter-data-redis en lugar de la dependencia de Caffeine;
# en compose.yaml, un servicio Redis y la variable SGPC_REDIS_HOST.

# Servidor Redis compartido por todas las instancias
spring.data.redis.host=${SGPC_REDIS_HOST}
spring.data.redis.port=6379

# Caducidad por defecto de todas las regiones de caché
spring.cache.redis.time-to-live=1h

# Ejercicio E4.4 (líneas añadidas)
spring.cache.type=redis
# Reactiva el indicador de Redis que el archivo base desactiva para desarrollo
management.health.redis.enabled=true
